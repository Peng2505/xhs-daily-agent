<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;}
  body{
    width:1080px;height:1440px;box-sizing:border-box;
    background:linear-gradient(150deg,#0b1020 0%,#1b1f4b 55%,#3b1d5e 100%);
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#fff;
    padding:96px 84px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .tag{display:inline-block;font-size:34px;letter-spacing:2px;
       border:3px solid rgba(255,255,255,.55);border-radius:999px;
       padding:14px 34px;opacity:.85;}
  h1{font-size:104px;line-height:1.22;margin:56px 0 0;font-weight:900;letter-spacing:2px;}
  h1 em{font-style:normal;background:linear-gradient(90deg,#7ef0d0,#7aa2ff);
        -webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{font-size:40px;line-height:1.55;opacity:.8;margin-top:48px;}
  ul{list-style:none;padding:0;margin:0;font-size:36px;line-height:1.85;opacity:.92;}
  li::before{content:"▍";color:#7ef0d0;margin-right:16px;}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;
        font-size:30px;opacity:.55;}
</style>
</head>
<body>
  <div><span class="tag">AI 日报 · DAILY</span></div>
  <div>
    <h1>今天 AI 圈<br><em>5 件事</em></h1>
    <div class="sub">大模型 / 开源 / 应用<br>90 秒看完，不废话</div>
  </div>
  <ul>
    <li>模型发布与版本更新</li>
    <li>论文与开源项目</li>
    <li>能马上用上的 AI 玩法</li>
  </ul>
  <div class="foot"><span>@你的账号</span><span>2026.09.14</span></div>
</body>
</html>
